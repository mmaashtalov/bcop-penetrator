<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадровый радар</title><style>:root{--a:#245c53;--b:#f4f6f7;--l:#d7e0de;--m:#66736f}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#1c2927;font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;padding:12px 16px;background:#f4f6f7e8;border-bottom:1px solid var(--l);backdrop-filter:blur(10px)}main{max-width:1050px;margin:auto;padding:20px 12px 50px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #183c3510}.hero{padding:35px}.hero h1{font-size:clamp(34px,7vw,62px);line-height:1;margin:10px 0}.muted{color:var(--m)}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#e4eeec;font-size:12px;font-weight:800}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.pri{background:var(--a);color:#fff}.sec{background:#e4eeec;color:var(--a)}.out{background:#fff;border:1px solid var(--l)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}label{font-size:13px;font-weight:750}input,select{padding:12px;border:1px solid var(--l);border-radius:11px;background:#fff}.notice{border-left:4px solid var(--a);background:#eef3f2;padding:13px;border-radius:10px}.barrow{display:grid;grid-template-columns:150px 1fr 48px;gap:9px;align-items:center;margin:11px 0}.bar{height:12px;background:#e6ecea;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#5b958a)}.table{overflow:auto;border:1px solid var(--l);border-radius:13px;background:#fff}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px;border-bottom:1px solid var(--l);text-align:left}th{font-size:12px;background:#eef3f2}tr[data-id]{cursor:pointer}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border:1px solid var(--l);border-radius:12px;background:#fff}.opt.on{border-color:var(--a);background:#eaf3f1}.progress{height:9px;background:#dce6e3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--a)}.back{border:0;background:none;color:var(--a);font-weight:800}.big{font-size:34px;font-weight:900}.section{display:flex;justify-content:space-between;gap:12px;align-items:end}.bad{color:#a43b3b}.warn{color:#a9650b}.good{color:#287a4d}@media(max-width:720px){.g2,.g4,.fields{grid-template-columns:1fr}.hero{padding:24px}.barrow{grid-template-columns:105px 1fr 42px}.section{flex-direction:column;align-items:start}.actions .btn{flex:1 1 140px}}</style></head><body><header class="top"><b onclick="go('home')">КР · Кадровый радар</b><span class="pill">Публичный MVP</span></header><main id="app"></main><script>const C=[['a','Внимание'],['s','Пространственное мышление'],['t','Техническая грамотность'],['m','Механическое мышление'],['i','Работа по инструкции'],['v','Зрительная память'],['d','Цифровая грамотность'],['l','Обучаемость']],R={drv:{n:'Водитель',w:{a:20,s:20,t:15,m:10,i:20,v:5,d:5,l:5},c:{a:55,i:60}},mec:{n:'Механик',w:{a:10,s:10,t:20,m:25,i:15,v:5,d:5,l:10},c:{m:55,t:50}},uav:{n:'Оператор БПЛА',w:{a:20,s:20,t:15,m:5,i:15,v:10,d:10,l:5},c:{a:60,s:55,i:60}},rif:{n:'Стрелок',w:{a:25,s:15,t:5,m:5,i:25,v:15,d:0,l:10},c:{a:60,i:65}}},Q=[['a','Какой код отличается?',['7К4М2','7КМ42','7К4М2'],[0,100,0]],['s','Смотрите на север. Два поворота направо. Куда смотрите?',['Восток','Юг','Запад'],[50,100,0]],['t','Устройство не включается. Что проверить первым?',['Питание и подключение','Разобрать корпус','Менять детали'],[100,0,0]],['m','Шестерня A вращается по часовой и сцепле b></div>`;function home(){return`<section class="card hero"><span class="pill">Демонстрационный прототип</span><h1>Карта навыков личного состава</h1><p class="muted">Тестирование, автоматический рейтинг по должностям и карточка кандидата для командира.</p><div class="notice"><b>Важно:</b> система только ранжирует кандидатов. Назначение подтверждается практической проверкой.</div><div class="actions"><button class="btn pri" onclick="go('form')">Пройти оценку</button><button class="btn sec" onclick="go('cmd')">Панель командира</button></div></section><div class="grid g4">${Object.values(R).map(x=>`<div class="card"><b>${x.n}</b><p class="muted">Профиль компетенций и критические минимумы.</p></div>`).join('')}</div>`}function inp(id,n,v=''){return`<div class="field"><label>${n}</label><input id="${id}" value="${e(v)}"></div>`}function sel(id,n,a,v=''){return`<div class="field"><label>${n}</label><select id="${id}"><option></option>${a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select></div>`}function form(){return`<button class="back" onclick="go('home')">← Назад</button><div class="card"><h2>Анкета кандидата</h2><div class="fields">${inp('name','ФИО',S.f.name)}${sel('unit','Подразделение',['1 рота','2 рота','3 рота','Управление'],S.f.unit)}${inp('prof','Гражданская профессия',S.f.prof)}${inp('lic','Водительские категории',S.f.lic)}${sel('rep','Опыт ремонта',['Нет','Базовый','Регулярный','Профессиональный'],S.f.rep)}${sel('pc','Компьютерные навыки',['Минимальные','Уверенные','Продвинутые'],S.f.pc)}</div><div class="actions"><button class="btn pri" onclick="start()">Начать тест</button><button class="btn out" onclick="demo()">Демо-данные</button></div></div>`}function demo(){S.f={name:'Крылов Михаил Андреевич',unit:'2 рота',prof:'Автомеханик',lic:'B, C',rep:'Профессиональный',pc:'Уверенные'};render()}function val(x){return document.getElementById(x)?.value||''}function start(){S.f={name:val('name'),unit:val('unit'),prof:val('prof'),lic:val('lic'),rep:val('rep'),pc:val('pc')};if(!S.f.name)return alert('Укажите ФИО');S.q=0;S.a=[];go('test')}function test(){let q=Q[S.q];return`<button class="back" onclick="go('form')">← К анкете</button><div class="card"><h2>Оценка компетенций</h2><p class="muted">Задание ${S.q+1} из ${Q.length}</p><div class="progress"><i style="width:${S.q/Q.length*100}%"></i></div><h3>${q[1]}</h3>${q[2].map((x,i)=>`<button class="opt ${S.a[S.q]===i?'on':''}" onclick="S.a[S.q]=${i};render()">${x}</button>`).join('')}<div class="actions"><button class="btn out" ${S.q?'':'disabled'} onclick="S.q--;render()">Назад</button><button class="btn pri" ${S.a[S.q]===undefined?'disabled':''} onclick="next()">${S.q==Q.length-1?'Завершить':'Далее'}</button></div></div>`}function next(){if(S.a[S.q]===undefined)return;if(S.q<Q.length-1){S.q++;render();return}let c={};Q.forEach((q,i)=>c[q[0]]=q[3][S.a[i]]);if(['Регулярный','Профессиональный'].includes(S.f.rep)){c.m=Math.min(100,c.m+10);c.t=Math.min(100,c.t+5)}if(['Уверенные','Продвинутые'].includes(S.f.pc))c.d=Math.min(100,c.d+10);let a=load(),x=mk('u'+Date.now(),S.f.name,S.f.unit||'Не указано',c,S.f);a.unshift(x);save(a);S.id=x.id;go('card')}function cmd(){let a=load();return`<div class="section"><div><button class="back" onclick="go('home')">← Главная</button><h2>Панель командира</h2></div><button class="btn out" onclick="localStorage.removeItem('krdemo');render()">Сбросить демо</button></div><div class="grid g4"><div class="card"><div class="big">${a.length}</div><span class="muted">Оценено</span></div><div class="card"><div class="big">${a.filter(x=>x.z>=80).length}</div><span class="muted">От 80%</span></div><div class="card"><div class="big">${a.filter(x=>x.decision=='Практическая проверка').length}</div><span class="muted">Практика</span></div><div class="card"><div class="big">${a.filter(x=>x.decision=='Кадровый резерв').length}</div><span class="muted">Резерв</span></div></div><div class="table"><table><thead><tr><th>ФИО</th><th>Подразделение</th><th> ions"><button class="btn pri" onclick="decision('Практическая проверка')">Назначить практику</button><button class="btn sec" onclick="decision('Кадровый резерв')">В резерв</button><button class="btn out" onclick="decision('Решение зафиксировано')">Зафиксировать</button></div></div></div>`}function decision(v){let a=load(),x=a.find(z=>z.id==S.id);x.decision=v;save(a);render()}function downloadCard(){let x=load().find(z=>z.id==S.id),r=rec(x),rows=r.s.map(z=>`<tr><td>${R[z[0]].n}</td><td>${z[1].z}%</td><td>${z[1].st}</td></tr>`).join(''),h=`<!doctype html><meta charset=utf-8><title>Карточка ${e(x.n)}</title><style>body{font-family:Arial;max-width:900px;margin:30px auto;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:8px}h1{color:#245c53}</style><h1>${e(x.n)}</h1><p><b>Подразделение:</b> ${e(x.u)}</p><h2>Рекомендация</h2><p>Основное: <b>${R[r.main[0]].n} — ${r.main[1].z}%</b></p><p>Резерв: <b>${R[r.res[0]].n} — ${r.res[1].z}%</b></p><h2>Рейтинг</h2><table><tr><th>Должность</th><th>Балл</th><th>Статус</th></tr>${rows}</table><h2>Компетенции</h2><table>${C.map(z=>`<tr><td>${z[1]}</td><td>${x.c[z[0]]}%</td></tr>`).join('')}</table><p>Предварительная оценка. Требуется практическая проверка.</p>`;let b=new Blob([h],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Карточка_'+x.n.replace(/[^\p{L}\p{N}]+/gu,'_')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){document.getElementById('app').innerHTML=S.p=='home'?home():S.p=='form'?form():S.p=='test'?test():S.p=='cmd'?cmd():card()}render();</script></body></html>
