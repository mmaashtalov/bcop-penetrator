name: Deploy public mobile demo

on:
  push:
    branches:
      - codex/bcop-dialogue-core-v0.2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bcop-public-demo-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static public demo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and verify public demo
        env:
          VITE_PUBLIC_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm check:public-demo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-public-demo

  deploy:
    name: Deploy public mobile demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: bcop-public-demo-preview
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
