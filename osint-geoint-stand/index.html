<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>OSINT/GEOINT Workspace — Demo</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#2563eb;--good:#059669;--warn:#d97706;--bad:#dc2626;--shadow:0 8px 28px rgba(15,23,42,.08)}
[data-theme=dark]{--bg:#0b1120;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#253047;--accent:#60a5fa;--shadow:0 8px 30px rgba(0,0,0,.3)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.shell{max-width:820px;margin:auto;min-height:100dvh;padding:0 14px 92px}.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);padding:12px 0 10px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:16px;margin:0}.brand small{color:var(--muted)}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn.small{padding:7px 10px;border-radius:9px;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kpi strong{font-size:24px;display:block}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;background:#e0e7ff;color:#3730a3}.badge.good{background:#d1fae5;color:#065f46}.badge.warn{background:#ffedd5;color:#9a3412}.badge.bad{background:#fee2e2;color:#991b1b}.form{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}.field textarea{min-height:90px;resize:vertical}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;background:color-mix(in srgb,var(--card) 94%,var(--accent) 6%)}.item-title{font-weight:800}.hash{font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0 2px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 11px}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(820px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:none;color:var(--muted);display:grid;gap:2px;place-items:center;padding:5px;font-size:12px}.nav.active{color:var(--accent);font-weight:800}.nav span{font-size:20px}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.loginbox{width:min(520px,100%)}.role{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--card);cursor:pointer}.role:hover{border-color:var(--accent)}.notice{border-left:4px solid var(--warn);padding:10px 12px;background:color-mix(in srgb,var(--card) 88%,#f59e0b 12%);border-radius:10px}.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}.event{margin:0 0 14px;position:relative}.event:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}.empty{text-align:center;padding:28px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(2,6,23,.62);display:grid;place-items:end center;z-index:30}.sheet{background:var(--card);width:min(820px,100%);max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.close{float:right}.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--good)}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modal{place-items:center}.sheet{border-radius:22px;max-width:620px}.bottom{border:1px solid var(--line);border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div id="login" class="login hidden"></div>
<div id="app" class="shell hidden">
  <header class="top"><div class="row between"><div class="brand"><div class="logo">OG</div><div><h1>Analytical Workspace</h1><small id="userline"></small></div></div><button class="btn secondary small" onclick="toggleTheme()">◐</button></div></header>
  <main id="view"></main>
</div>
<nav id="bottom" class="bottom hidden">
<button class="nav" data-view="home" onclick="go('home')"><span>⌂</span>Главная</button>
<button class="nav" data-view="cases" onclick="go('cases')"><span>▣</span>Дела</button>
<button class="nav" data-view="review" onclick="go('review')"><span>✓</span>Проверка</button>
<button class="nav" data-view="profile" onclick="go('profile')"><span>●</span>Профиль</button>
</nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="btn secondary small close" onclick="closeModal()">Закрыть</button><div id="modalBody"></div></div></div>
<script>
const KEY='og_workspace_demo_v1';
const PROFILES=[
{id:'u1',name:'Михаил Орлов',role:'OWNER'},{id:'u2',name:'Анна Волкова',role:'ANALYST'},{id:'u3',name:'Илья Соколов',role:'REVIEWER'},{id:'u4',name:'Елена Морозова',role:'EDITOR'},{id:'u5',name:'Павел Лебедев',role:'OBSERVER'}];
const roleRu={OWNER:'Владелец',ANALYST:'Аналитик',REVIEWER:'Рецензент',EDITOR:'Редактор',OBSERVER:'Наблюдатель'};
let state=load(),user=null,currentView='home',caseId=null,caseTab='overview';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function seed(){return {cases:[{id:'c1',title:'Мониторинг городской инфраструктуры',description:'Демонстрационное дело по открытым муниципальным данным.',status:'ACTIVE',createdBy:'u1',createdAt:Date.now()-86400000}],materials:[{id:'m1',caseId:'c1',filename:'registry_extract.csv',mime:'text/csv',size:18240,sha256:'c5f8e9a73519c2476b4c29b5794f94cbb9f42cc01372e2498858f48e1531ad47',sourceType:'Открытый реестр',sourceUrl:'https://example.org/open-data',method:'Ручная загрузка',notes:'Тестовый материал',createdBy:'u2',createdAt:Date.now()-7200000}],observations:[{id:'o1',caseId:'c1',title:'Сроки обновления различаются',statement:'В двух опубликованных наборах указаны разные даты последнего обновления.',confidence:'MEDIUM',status:'IN_REVIEW',authorId:'u2',materialId:'m1',locator:'строки 12–18',createdAt:Date.now()-3600000}],hypotheses:[],reviews:[],reports:[{id:'r1',caseId:'c1',title:'Предварительная аналитическая записка',summary:'Черновой отчёт для демонстрации контроля доказательств.',status:'DRAFT',authorId:'u4',claims:[{id:'cl1',text:'Часть сведений требует дополнительной верификации.',confidence:'MEDIUM',observationId:'o1',reviewed:false}],createdAt:Date.now()-1800000}],approvals:[],audit:[],session:null,theme:'light'}}
function id(p){return p+Math.random().toString(36).slice(2,9)}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(t){return new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
async function sha(text){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function audit(action,entityType,entityId,payload={},cid=caseId){const prev=state.audit.at(-1)?.eventHash||'';const e={id:id('a'),caseId:cid,actorId:user?.id||'system',action,entityType,entityId,payload,previousHash:prev,createdAt:Date.now()};e.eventHash=await sha(JSON.stringify({...e,eventHash:undefined}));state.audit.push(e);save()}
function canWrite(){return user&&user.role!=='OBSERVER'}
function loginScreen(){document.documentElement.dataset.theme=state.theme;document.querySelector('#login').innerHTML=`<div class="loginbox"><div class="card"><div class="brand"><div class="logo">OG</div><div><h1>OSINT/GEOINT Workspace</h1><div class="muted">Гражданская аналитика открытых данных</div></div></div><p class="notice">Демонстрационная авторизация. Не используйте стенд для конфиденциальных или персональных данных.</p><h3>Войти в демо</h3>${PROFILES.map(p=>`<button class="role" onclick="login('${p.id}')"><span><b>${esc(p.name)}</b><br><small class="muted">${roleRu[p.role]}</small></span><span>→</span></button>`).join('')}<button class="btn secondary" style="width:100%;margin-top:8px" onclick="resetDemo()">Сбросить демо-данные</button></div></div>`;document.querySelector('#login').classList.remove('hidden')}
async function login(uid){user=PROFILES.find(x=>x.id===uid);state.session=uid;save();await audit('SESSION_LOGIN','profile',uid,{role:user.role},null);boot()}
function logout(){state.session=null;save();user=null;document.querySelector('#app').classList.add('hidden');document.querySelector('#bottom').classList.add('hidden');loginScreen()}
function boot(){user=PROFILES.find(x=>x.id===state.session);if(!user){loginScreen();return}document.querySelector('#login').classList.add('hidden');document.querySelector('#app').classList.remove('hidden');document.querySelector('#bottom').classList.remove('hidden');document.querySelector('#userline').textContent=`${user.name} · ${roleRu[user.role]}`;go(currentView)}
function go(v){currentView=v;caseId=null;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===v));({home:renderHome,cases:renderCases,review:renderReview,profile:renderProfile}[v]||renderHome)()}
function kpi(n,label){return `<div class="card kpi"><strong>${n}</strong><span class="muted">${label}</span></div>`}
function renderHome(){const pending=state.observations.filter(o=>o.status==='IN_REVIEW'&&o.authorId!==user.id).length;document.querySelector('#view').innerHTML=`<div class="row between"><h2>Рабочий стол</h2><span class="badge">DEMO</span></div><div class="grid">${kpi(state.cases.length,'Дела')}${kpi(state.materials.length,'Материалы')}${kpi(pending,'На проверке')}${kpi(state.reports.filter(r=>r.status==='PUBLISHED').length,'Опубликовано')}</div><div class="card"><h3>Последние действия</h3>${timeline(state.audit.slice(-6).reverse())}</div><div class="card"><h3>Контрольные правила</h3><div class="list"><div class="item">✓ Автор не проверяет собственные выводы</div><div class="item">✓ Evidence остаётся внутри дела</div><div class="item">✓ Материалы дедуплицируются по SHA-256</div><div class="item">✓ Публикацию подтверждает второе лицо</div></div></div>`}
function renderCases(){document.querySelector('#view').innerHTML=`<div class="row between"><h2>Дела</h2>${canWrite()?`<button class="btn small" onclick="caseForm()">+ Новое</button>`:''}</div><div class="list">${state.cases.map(c=>`<button class="card" style="text-align:left;width:100%" onclick="openCase('${c.id}')"><div class="row between"><b>${esc(c.title)}</b><span class="badge good">${c.status}</span></div><p class="muted">${esc(c.description)}</p><small>${state.materials.filter(m=>m.caseId===c.id).length} материалов · ${state.observations.filter(o=>o.caseId===c.id).length} наблюдений</small></button>`).join('')||'<div class="empty">Дел пока нет</div>'}</div>`}
function caseForm(){modal(`<h2>Новое дело</h2><form class="form" onsubmit="createCase(event)"><div class="field"><label>Название</label><input name="title" required></div><div class="field"><label>Описание</label><textarea name="description" required></textarea></div><button class="btn">Создать дело</button></form>`)}
async function createCase(e){e.preventDefault();const f=new FormData(e.target),c={id:id('c'),title:f.get('title'),description:f.get('description'),status:'ACTIVE',createdBy:user.id,createdAt:Date.now()};state.cases.push(c);await audit('CASE_CREATED','case',c.id,{title:c.title},c.id);closeModal();renderCases()}
function openCase(cid){caseId=cid;caseTab='overview';renderCase()}
function renderCase(){const c=state.cases.find(x=>x.id===caseId);if(!c)return renderCases();document.querySelector('#view').innerHTML=`<button class="btn secondary small" onclick="go('cases')">← Дела</button><div class="card"><div class="row between"><div><h2>${esc(c.title)}</h2><div class="muted">${esc(c.description)}</div></div><span class="badge good">${c.status}</span></div></div><div class="tabs">${[['overview','Обзор'],['materials','Материалы'],['observations','Наблюдения'],['hypotheses','Гипотезы'],['reports','Отчёты'],['audit','Аудит']].map(([k,n])=>`<button class="tab ${caseTab===k?'active':''}" onclick="setCaseTab('${k}')">${n}</button>`).join('')}</div><section id="caseContent"></section>`;renderCaseTab()}
function setCaseTab(t){caseTab=t;renderCase()}
function renderCaseTab(){const m=state.materials.filter(x=>x.caseId===caseId),o=state.observations.filter(x=>x.caseId===caseId),h=state.hypotheses.filter(x=>x.caseId===caseId),r=state.reports.filter(x=>x.caseId===caseId);let html='';
if(caseTab==='overview')html=`<div class="grid">${kpi(m.length,'Материалы')}${kpi(o.length,'Наблюдения')}${kpi(h.length,'Гипотезы')}${kpi(r.length,'Отчёты')}</div><div class="card"><h3>Состояние дела</h3><div class="progress"><i style="width:${Math.min(100,20+m.length*15+o.filter(x=>x.status==='ACCEPTED').length*20+r.filter(x=>x.status==='PUBLISHED').length*30)}%"></i></div><p class="muted">Готовность рассчитывается по наличию материалов, принятых наблюдений и опубликованного отчёта.</p></div>`;
if(caseTab==='materials')html=`<div class="row between"><h3>Материалы</h3>${canWrite()?`<button class="btn small" onclick="materialForm()">+ Загрузить</button>`:''}</div><div class="list">${m.map(x=>`<div class="item"><div class="row between"><b>${esc(x.filename)}</b><span class="badge">immutable</span></div><div>${Math.round(x.size/1024)} КБ · ${esc(x.mime)}</div><div class="hash">${x.sha256}</div><small class="muted">${esc(x.sourceType)} · ${esc(x.method)}</small></div>`).join('')||'<div class="empty">Материалов нет</div>'}</div>`;
if(caseTab==='observations')html=`<div class="row between"><h3>Наблюдения</h3>${canWrite()?`<button class="btn small" onclick="observationForm()">+ Создать</button>`:''}</div><div class="list">${o.map(obsCard).join('')||'<div class="empty">Наблюдений нет</div>'}</div>`;
if(caseTab==='hypotheses')html=`<div class="row between"><h3>Гипотезы</h3>${canWrite()?`<button class="btn small" onclick="hypothesisForm()">+ Создать</button>`:''}</div><div class="list">${h.map(x=>`<div class="item"><div class="row between"><b>${esc(x.title)}</b><span class="badge warn">${x.confidence}</span></div><p>${esc(x.statement)}</p><small class="muted">Опирается на ${x.observationIds.length} наблюдений</small></div>`).join('')||'<div class="empty">Гипотез нет</div>'}</div>`;
if(caseTab==='reports')html=`<div class="row between"><h3>Отчёты</h3>${canWrite()?`<button class="btn small" onclick="reportForm()">+ Создать</button>`:''}</div><div class="list">${r.map(reportCard).join('')||'<div class="empty">Отчётов нет</div>'}</div>`;
if(caseTab==='audit')html=`<div class="row between"><h3>Audit trail</h3><button class="btn secondary small" onclick="verifyChain()">Проверить цепочку</button></div><div class="card">${timeline(state.audit.filter(a=>a.caseId===caseId).slice().reverse())}</div>`;
document.querySelector('#caseContent').innerHTML=html}
function materialForm(){modal(`<h2>Загрузка материала</h2><form class="form" onsubmit="uploadMaterial(event)"><div class="field"><label>Файл</label><input type="file" name="file" required></div><div class="field"><label>Тип источника</label><select name="sourceType"><option>Открытый реестр</option><option>Официальный сайт</option><option>Публичный документ</option><option>Медиа</option></select></div><div class="field"><label>URL источника</label><input name="sourceUrl" type="url" placeholder="https://"></div><div class="field"><label>Метод получения</label><input name="method" value="Ручная загрузка" required></div><div class="field"><label>Примечание</label><textarea name="notes"></textarea></div><button class="btn">Зафиксировать оригинал</button></form>`)}
async function uploadMaterial(e){e.preventDefault();const f=new FormData(e.target),file=f.get('file'),buf=await file.arrayBuffer(),dig=await crypto.subtle.digest('SHA-256',buf),hash=[...new Uint8Array(dig)].map(x=>x.toString(16).padStart(2,'0')).join('');if(state.materials.some(m=>m.caseId===caseId&&m.sha256===hash)){alert('Дубликат: материал с таким SHA-256 уже есть в деле.');return}const m={id:id('m'),caseId,filename:file.name,mime:file.type||'application/octet-stream',size:file.size,sha256:hash,sourceType:f.get('sourceType'),sourceUrl:f.get('sourceUrl'),method:f.get('method'),notes:f.get('notes'),createdBy:user.id,createdAt:Date.now()};state.materials.push(m);await audit('MATERIAL_INGESTED','material',m.id,{filename:m.filename,sha256:hash});closeModal();renderCase()}
function observationForm(){const mats=state.materials.filter(m=>m.caseId===caseId);if(!mats.length)return alert('Сначала добавьте материал.');modal(`<h2>Новое наблюдение</h2><form class="form" onsubmit="createObservation(event)"><div class="field"><label>Заголовок</label><input name="title" required></div><div class="field"><label>Формулировка</label><textarea name="statement" required></textarea></div><div class="field"><label>Evidence</label><select name="materialId">${mats.map(m=>`<option value="${m.id}">${esc(m.filename)}</option>`)}</select></div><div class="field"><label>Локатор</label><input name="locator" placeholder="страница, строки, таймкод" required></div><div class="field"><label>Уверенность</label><select name="confidence"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div><button class="btn">Отправить на проверку</button></form>`)}
async function createObservation(e){e.preventDefault();const f=new FormData(e.target),o={id:id('o'),caseId,title:f.get('title'),statement:f.get('statement'),confidence:f.get('confidence'),status:'IN_REVIEW',authorId:user.id,materialId:f.get('materialId'),locator:f.get('locator'),createdAt:Date.now()};state.observations.push(o);await audit('OBSERVATION_SUBMITTED','observation',o.id,{confidence:o.confidence});closeModal();renderCase()}
function obsCard(o){const author=PROFILES.find(p=>p.id===o.authorId);return `<div class="item"><div class="row between"><b>${esc(o.title)}</b><span class="badge ${o.status==='ACCEPTED'?'good':o.status==='REJECTED'?'bad':'warn'}">${o.status}</span></div><p>${esc(o.statement)}</p><small class="muted">${author?.name} · ${o.confidence} · ${esc(o.locator)}</small></div>`}
function hypothesisForm(){const obs=state.observations.filter(o=>o.caseId===caseId&&o.status==='ACCEPTED');if(!obs.length)return alert('Нужны принятые наблюдения.');modal(`<h2>Новая гипотеза</h2><form class="form" onsubmit="createHypothesis(event)"><div class="field"><label>Название</label><input name="title" required></div><div class="field"><label>Формулировка</label><textarea name="statement" required></textarea></div><div class="field"><label>Наблюдения</label>${obs.map(o=>`<label><input type="checkbox" name="obs" value="${o.id}"> ${esc(o.title)}</label>`).join('')}</div><div class="field"><label>Уверенность</label><select name="confidence"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div><button class="btn">Создать гипотезу</button></form>`)}
async function createHypothesis(e){e.preventDefault();const f=new FormData(e.target),ids=f.getAll('obs');if(!ids.length)return alert('Выберите хотя бы одно наблюдение.');const h={id:id('h'),caseId,title:f.get('title'),statement:f.get('statement'),confidence:f.get('confidence'),observationIds:ids,authorId:user.id,createdAt:Date.now()};state.hypotheses.push(h);await audit('HYPOTHESIS_CREATED','hypothesis',h.id,{observations:ids});closeModal();renderCase()}
function reportForm(){const obs=state.observations.filter(o=>o.caseId===caseId&&o.status==='ACCEPTED');if(!obs.length)return alert('Для отчёта нужно принятое наблюдение.');modal(`<h2>Новый отчёт</h2><form class="form" onsubmit="createReport(event)"><div class="field"><label>Название</label><input name="title" required></div><div class="field"><label>Резюме</label><textarea name="summary" required></textarea></div><div class="field"><label>Первое утверждение</label><textarea name="claim" required></textarea></div><div class="field"><label>Evidence-наблюдение</label><select name="observationId">${obs.map(o=>`<option value="${o.id}">${esc(o.title)}</option>`)}</select></div><button class="btn">Создать черновик</button></form>`)}
async function createReport(e){e.preventDefault();const f=new FormData(e.target),r={id:id('r'),caseId,title:f.get('title'),summary:f.get('summary'),status:'DRAFT',authorId:user.id,claims:[{id:id('cl'),text:f.get('claim'),confidence:'MEDIUM',observationId:f.get('observationId'),reviewed:false}],createdAt:Date.now()};state.reports.push(r);await audit('REPORT_CREATED','report',r.id,{claims:1});closeModal();renderCase()}
function reportCard(r){const ready=r.claims.length&&r.claims.every(c=>c.observationId&&c.reviewed);return `<div class="item"><div class="row between"><b>${esc(r.title)}</b><span class="badge ${r.status==='PUBLISHED'?'good':'warn'}">${r.status}</span></div><p>${esc(r.summary)}</p>${r.claims.map(c=>`<div class="card"><b>Утверждение</b><p>${esc(c.text)}</p><span class="badge ${c.reviewed?'good':'warn'}">${c.reviewed?'review пройден':'нужен review'}</span></div>`).join('')}<div class="row">${r.status==='DRAFT'&&r.authorId!==user.id&&['REVIEWER','OWNER','EDITOR'].includes(user.role)?`<button class="btn good small" onclick="reviewClaim('${r.id}')">Проверить утверждения</button>`:''}${r.status==='DRAFT'&&r.authorId===user.id?`<button class="btn small" ${ready?'':'disabled'} onclick="requestPublish('${r.id}')">Запросить публикацию</button>`:''}${r.status==='READY'&&r.authorId!==user.id&&['OWNER','EDITOR'].includes(user.role)?`<button class="btn good small" onclick="approvePublish('${r.id}')">Одобрить публикацию</button>`:''}</div></div>`}
async function reviewClaim(rid){const r=state.reports.find(x=>x.id===rid);if(r.authorId===user.id)return alert('Автор не может проверять свой отчёт.');r.claims.forEach(c=>c.reviewed=true);state.reviews.push({id:id('rv'),targetType:'report',targetId:rid,reviewerId:user.id,decision:'APPROVE',createdAt:Date.now()});await audit('REPORT_CLAIMS_APPROVED','report',rid,{});renderCase()}
async function requestPublish(rid){const r=state.reports.find(x=>x.id===rid);if(!r.claims.every(c=>c.observationId&&c.reviewed))return alert('Каждое утверждение должно иметь evidence и независимый review.');r.status='READY';await audit('PUBLICATION_REQUESTED','report',rid,{});renderCase()}
async function approvePublish(rid){const r=state.reports.find(x=>x.id===rid);if(r.authorId===user.id)return alert('Автор не может одобрить публикацию.');r.status='PUBLISHED';state.approvals.push({id:id('p'),reportId:rid,approverId:user.id,decision:'APPROVE',createdAt:Date.now()});await audit('REPORT_PUBLISHED','report',rid,{approver:user.id});renderCase()}
function renderReview(){const obs=state.observations.filter(o=>o.status==='IN_REVIEW'&&o.authorId!==user.id);document.querySelector('#view').innerHTML=`<div class="row between"><h2>Очередь проверки</h2><span class="badge">${obs.length}</span></div>${user.role==='OBSERVER'?'<p class="notice">Наблюдатель имеет доступ только для чтения.</p>':''}<div class="list">${obs.map(o=>`<div class="card">${obsCard(o)}${['REVIEWER','OWNER','EDITOR'].includes(user.role)?`<div class="row"><button class="btn good small" onclick="reviewObservation('${o.id}','ACCEPTED')">Одобрить</button><button class="btn bad small" onclick="reviewObservation('${o.id}','REJECTED')">Отклонить</button></div>`:''}</div>`).join('')||'<div class="empty">Нет объектов, доступных вам для проверки.</div>'}</div>`}
async function reviewObservation(oid,decision){const o=state.observations.find(x=>x.id===oid);if(o.authorId===user.id)return alert('Самопроверка запрещена.');let comment='';if(decision==='REJECTED'&&!(comment=prompt('Причина отклонения:')))return;o.status=decision;state.reviews.push({id:id('rv'),targetType:'observation',targetId:oid,reviewerId:user.id,decision,comment,createdAt:Date.now()});await audit('OBSERVATION_'+decision,'observation',oid,{comment},o.caseId);renderReview()}
function renderProfile(){document.querySelector('#view').innerHTML=`<h2>Профиль</h2><div class="card"><h3>${esc(user.name)}</h3><span class="badge">${roleRu[user.role]}</span><p class="muted">Демо-профиль. Реальная аутентификация и разграничение доступа будут подключены на серверном стенде.</p><button class="btn secondary" onclick="logout()">Сменить пользователя</button></div><div class="card"><h3>Режим стенда</h3><p>Данные сохраняются только в localStorage этого браузера. Загруженные файлы не отправляются в интернет: сохраняются только метаданные и SHA-256.</p><button class="btn bad" onclick="resetDemo()">Сбросить данные</button></div>`}
function timeline(events){return events.length?`<div class="timeline">${events.map(a=>`<div class="event"><b>${esc(a.action)}</b><div class="muted">${PROFILES.find(p=>p.id===a.actorId)?.name||'Система'} · ${fmt(a.createdAt)}</div><div class="hash">${a.eventHash||'ожидает хэширования'}</div></div>`).join('')}</div>`:'<div class="empty">Событий пока нет</div>'}
async function verifyChain(){let prev='';for(const e of state.audit){if(e.previousHash!==prev)return alert('Цепочка нарушена на событии '+e.id);const expected=await sha(JSON.stringify({...e,eventHash:undefined}));if(expected!==e.eventHash)return alert('Хэш не совпадает на событии '+e.id);prev=e.eventHash}alert('Цепочка целостна: '+state.audit.length+' событий.')}
function modal(html){document.querySelector('#modalBody').innerHTML=html;document.querySelector('#modal').classList.remove('hidden')}
function closeModal(){document.querySelector('#modal').classList.add('hidden')}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;save()}
function resetDemo(){if(!confirm('Сбросить все демо-данные?'))return;state=seed();save();location.reload()}
boot();
</script>
</body></html>
